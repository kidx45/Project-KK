syntax = "proto3";

package pb;

import "user.proto";

option go_package = "github.com/kidx45/Project-KK/pb";

message CreateUserRequest {
    string user_name = 1;
    string password = 2;
    string email = 3;
    string full_name = 4;
    string phone_number = 5;
}

message CreateUserResponse {
    User user = 1;
}
// saving memory when using 1-15, will use only 1 byte