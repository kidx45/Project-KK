name: Build and Push to Harbor

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from GitHub secrets
        run: |
          echo "DB_URL=${{ secrets.DB_URL }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env
          echo "DB_DRIVER_NAME=${{ secrets.DB_DRIVER_NAME }}" >> .env
          echo "SYMMETRIC_SECRET_KEY=${{ secrets.SYMMETRIC_SECRET_KEY }}" >> .env
          echo "ACCESS_TOKEN_DURATION=${{ secrets.ACCESS_TOKEN_DURATION }}" >> .env

      - name: Login to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ secrets.HARBOR_URL }} \
            --username ${{ secrets.HARBOR_USERNAME }} \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.HARBOR_URL }}/${{ secrets.HARBOR_PROJECT }}/api:${{ github.sha }} .

      - name: Push image to Harbor
        run: |
          docker push ${{ secrets.HARBOR_URL }}/${{ secrets.HARBOR_PROJECT }}/api:${{ github.sha }}
          
          docker tag ${{ secrets.HARBOR_URL }}/${{ secrets.HARBOR_PROJECT }}/api:${{ github.sha }} \
            ${{ secrets.HARBOR_URL }}/${{ secrets.HARBOR_PROJECT }}/api:latest
          docker push ${{ secrets.HARBOR_URL }}/${{ secrets.HARBOR_PROJECT }}/api:latest